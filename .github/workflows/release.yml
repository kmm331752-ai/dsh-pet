name: Release

# 打 tag 就自动构建 exe 并发 Release —— 不用手工跑 build_exe.py 再传。
# 用法：
#   git tag v1.2.0 && git push origin v1.2.0
#
# build_exe.py 内部先 `git archive` 导出已提交的文件再打包，
# 所以本地那些被 .gitignore 排除的受限素材不会混进产物 —— CI 上同理。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v1.2.0）"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: 构建并发布
    runs-on: windows-latest
    # Windows runner 的控制台默认是 cp1252，而 build_exe.py 和测试都会
    # 打印中文 —— 不加这个会 UnicodeEncodeError 崩在第一步。
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # build_exe.py 要用 git archive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          # 必须和 README 里写的可选依赖一致 —— 漏装不会报错，只会让打出来的
          # exe 悄悄少功能（实测：漏 numpy 时 51MB 缩到 31MB，不容易发现）：
          #   numpy / pypdfium2  -> clawd 主题的 SVG 光栅化
          #   svglib / reportlab -> 同上的前半段（SVG -> PDF）
          #   pystray            -> 托盘图标
          pip install pillow zstandard numpy pystray pyinstaller
          pip install svglib reportlab pypdfium2
          # 音乐交互走 SMTC。用模块化包（4.8MB），不用单体的 winsdk（41.7MB）
          pip install winrt-runtime winrt-Windows.Foundation winrt-Windows.Foundation.Collections winrt-Windows.Media.Control winrt-Windows.Media.Core winrt-Windows.Media.Playback winrt-Windows.Storage

      - name: 跑测试（测试不过就不发版）
        run: |
          python tests/test_pet.py
          python tests/test_smoke.py
          python tests/test_e2e.py

      - name: 构建 exe
        run: python build_exe.py

      - name: 校验产物
        run: |
          $exe = "dist/DSH-Pet.exe"
          if (-not (Test-Path $exe)) { throw "没找到 $exe" }
          $mb = (Get-Item $exe).Length / 1MB
          Write-Host "产物大小: $([math]::Round($mb,1)) MB"
          # 上限：夹带了 clawd 素材的话会明显大于这个数（那批有 168MB）
          if ($mb -gt 120) { throw "exe 异常大（$mb MB），可能夹带了不该分发的素材" }
          # 下限：漏装可选依赖的话会明显偏小。51MB 是带全依赖的实测值，
          # 31MB 是漏 numpy 的样子，42MB 是漏 svglib/reportlab/pypdfium2 的样子
          # —— 这种"少功能"不会报错，只能靠体积拦。
          if ($mb -lt 48) { throw "exe 偏小（$mb MB），可能漏装了可选依赖" }

      - name: 装 Inno Setup
        # runner 上自带 chocolatey，装完就有 ISCC.exe。
        # 本机没装，所以安装包一直没被真正构建过 —— 放到 CI 里才验证得了。
        run: choco install innosetup --no-progress -y

      - name: 构建安装包
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "找不到 ISCC.exe" }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败" }
          Get-ChildItem installer\*.exe | ForEach-Object {
            Write-Host "安装包: $($_.Name)  $([math]::Round($_.Length/1MB,1)) MB"
          }

      - name: 校验安装包
        run: |
          $setup = Get-ChildItem installer\DSH-Pet-Setup-*.exe -ErrorAction SilentlyContinue |
                   Select-Object -First 1
          if (-not $setup) { throw "没生成安装包" }
          # installer.iss 里 Source 引用的四个文件，缺一个 Inno 就编不过，
          # 能编过就说明都在。这里再确认一次产物本身合理。
          $mb = $setup.Length / 1MB
          if ($mb -lt 20) { throw "安装包偏小（$mb MB），可能漏打了主程序" }
          Write-Host "✅ $($setup.Name)  $([math]::Round($mb,1)) MB"

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/DSH-Pet.exe
            installer/DSH-Pet-Setup-*.exe
          generate_release_notes: true
          draft: false
