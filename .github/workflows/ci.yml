name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试（Windows / Python ${{ matrix.python }}）
    runs-on: windows-latest
    # Windows runner 的控制台默认是 cp1252，而测试和脚本都会打印中文，
    # 不加这个会 UnicodeEncodeError 崩掉。
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    strategy:
      fail-fast: false
      matrix:
        # 3.10 是 README 里声明的最低版本，3.12 是当前主力
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          # 只装跑测试需要的；pystray / numpy 是可选功能，测试里不碰
          pip install pillow zstandard

      - name: 单元测试（状态机 / 渲染 / 解析 / 出错日志）
        run: python tests/test_pet.py

      - name: 冒烟测试（真的把 PetApp 建起来）
        # 这一层才是拦「启动即崩」的 —— 两次发版事故（self.greeted、
        # _skin_menu）都是启动就崩，而单元测试一个都没拦住，
        # 因为它们根本不构造 PetApp。
        run: python tests/test_smoke.py

      - name: 端到端测试（配置 → 屏幕像素）
        # 拦「零件都对、路走不通」—— 配饰那个 bug 就是这种：
        # draw_accessory 的单测通过，但配置被 BOM 吞掉、绘制污染缓存，
        # 一个都没测到，最后是用户发现的。
        run: python tests/test_e2e.py

      - name: 语法检查（打包脚本也要能编译）
        run: |
          python -m py_compile pet_base.py pet_types.py pet_render.py
          python -m py_compile pet_sources.py pet_system.py pet_skin_install.py
          python -m py_compile pet_accessories.py pet_chat.py pet_i18n.py pet_platform.py
          python -m py_compile dsh_pet.py build_exe.py
          python -m py_compile tests/test_pet.py tests/test_smoke.py tests/test_e2e.py
