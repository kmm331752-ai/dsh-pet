name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试（Windows / Python ${{ matrix.python }}）
    runs-on: windows-latest
    # Windows runner 的控制台默认是 cp1252，而测试和脚本都会打印中文，
    # 不加这个会 UnicodeEncodeError 崩掉。
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    strategy:
      fail-fast: false
      matrix:
        # 3.10 是 README 里声明的最低版本，3.12 是当前主力
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          # 只装跑测试需要的；pystray / numpy 是可选功能，测试里不碰
          pip install pillow zstandard

      - name: 单元测试（状态机 / 渲染 / 解析 / 出错日志）
        run: python tests/test_pet.py

      - name: 冒烟测试（真的把 PetApp 建起来）
        # 这一层才是拦「启动即崩」的 —— 两次发版事故（self.greeted、
        # _skin_menu）都是启动就崩，而单元测试一个都没拦住，
        # 因为它们根本不构造 PetApp。
        run: python tests/test_smoke.py

      - name: 端到端测试（配置 → 屏幕像素）
        # 拦「零件都对、路走不通」—— 配饰那个 bug 就是这种：
        # draw_accessory 的单测通过，但配置被 BOM 吞掉、绘制污染缓存，
        # 一个都没测到，最后是用户发现的。
        run: python tests/test_e2e.py

      - name: 「反复踩的坑」单元测试
        # 拦两件事：**编**（把只出现一次的坑报成规律）和**泄**
        # （把路径/文件名/你的代码写进状态文件）。
        run: python tests/test_lint.py

      - name: 「反复踩的坑」端到端（走 _poll）
        # **这一层不能省。** AGENTS.md 规则 1 记了四次同一个事故：
        # 功能挂在只走一条分支的路径上。这功能最容易重演久坐提醒那次 ——
        # 报错恰恰发生在 DSH **正在跑工具**的时候，而 DSH 忙时
        # CompanionSource.poll() 根本不跑。
        #
        # 写这几条的时候真的抓到一个：Snapshot 压根没有 error 字段，
        # 于是整个功能在真机上一次都不会触发，而且不报错。
        run: python tests/test_lint_e2e.py

      - name: git 感知（没装 DSH 也能用的那一半）
        # **这个功能的意义就是"不装 DSH 也能用"**，所以它必须有独立测试。
        # 里面有 `test_clicking_it_opens_the_window` —— 从**菜单**点进去，
        # 不是直接调方法。上一版报告窗口的测试直接调 `_open_lint_report()`，
        # 全绿，而菜单里根本没有那一项（加菜单的脚本用"文件里有没有这个
        # 字符串"判重，撞上了 docstring）。
        run: python tests/test_git.py

      - name: 喂食（菜单 → 点食物 → 连点三次）
        # 拦过两次：窗口每次喂完销毁重建，而重建不设 geometry ——
        # 喂一口窗口就跳到屏幕左上角（实测 (330,291) -> (96,57)），
        # 而且第二次开始 invoke 抛 `invalid command name`。
        # 测试从**菜单**进、点**真按钮**，不是直接调 _do_feed()。
        run: python tests/test_feed.py

      - name: 追鼠标（看 → 过来 → 再看一眼）
        # 抄 oneko 的核心行为，但加了三个刹车：光标得动、够近就不追、
        # 追太久放弃。测的正是这三个刹车 —— 不然她会像 oneko 一样
        # 一路跟着你烦。
        run: python tests/test_chase.py

      - name: 长跑测试（0.15 模拟小时）
        # 拦「每帧都在漏」那种 —— 15,600 帧，每帧漏 1KB 就是 15MB，
        # 判定阈值是 80MB / 60%，抓得住。
        # 测不出「每小时漏一点」那种，那个靠手动跑 --hours 8。
        #
        # 只在一个 Python 版本上跑 —— 泄漏跟解释器版本关系不大，
        # 跑两遍白花 40 秒。
        if: matrix.python == '3.12'
        run: python tools/soak.py --hours 0.15 --quiet

      - name: 语法检查（打包脚本也要能编译）
        run: |
          python -m py_compile pet_base.py pet_types.py pet_render.py
          python -m py_compile pet_sources.py pet_system.py pet_skin_install.py
          python -m py_compile pet_accessories.py pet_chat.py pet_i18n.py pet_platform.py pet_food.py pet_music.py pet_activity.py pet_lint.py
          python -m py_compile dsh_pet.py build_exe.py tools/soak.py
          python -m py_compile tests/test_pet.py tests/test_smoke.py tests/test_e2e.py tests/test_lint.py tests/test_lint_e2e.py tests/test_git.py tests/test_feed.py tests/test_chase.py
